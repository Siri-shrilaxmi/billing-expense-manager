<body>

  <!-- ========================================================= -->
  <!-- TESSERACT.JS                                             -->
  <!-- ========================================================= -->

  <script
    src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js">
  </script>

  <!-- ========================================================= -->
  <!-- FLUTTER TESSERACT WEB BRIDGE                             -->
  <!-- ========================================================= -->

  <script>
    async function _extractText(
      imagePath,
      mapData
    ) {
      const worker =
        await Tesseract.createWorker();

      try {
        await worker.load();

        await worker.loadLanguage(
          mapData.language
        );

        await worker.initialize(
          mapData.language
        );

        await worker.setParameters(
          mapData.args || {}
        );

        const result =
          await worker.recognize(
            imagePath
          );

        if (
          mapData.args &&
          mapData.args["tessjs_create_hocr"]
        ) {
          return result.data.hocr;
        }

        return result.data.text;

      } finally {
        await worker.terminate();
      }
    }
  </script>

  <!-- ========================================================= -->
  <!-- FLUTTER WEB BOOTSTRAP                                    -->
  <!-- ========================================================= -->

  <script
    src="flutter_bootstrap.js"
    async>
  </script>

</body>
